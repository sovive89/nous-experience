<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NØUS — Conecte. Entenda. Evolua.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700&display=swap">
<style>
:root{--ice:#e9eef3;--navy:#14284b;--orange:#ff6a1a;--ink-soft:#5b6b82;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--disp:"Sora",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ice);color:var(--navy);font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden}
.player{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--ice)}
.player video{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;display:block;border-radius:8px;text-decoration:none;opacity:0;pointer-events:none;outline:2px solid transparent;outline-offset:2px;transition:background .2s,outline-color .2s}
.ended .hot{opacity:1;pointer-events:auto}
.hot:hover,.hot:focus-visible{background:rgba(255,255,255,.28);outline-color:var(--c)}
.menu{position:absolute;top:2.2%;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
.ended .menu{opacity:1;pointer-events:auto}
.menu a,.list a{display:inline-flex;gap:7px;align-items:center;font:600 clamp(10px,1.05vw,13px) var(--mono);color:var(--navy);text-decoration:none;background:rgba(255,255,255,.78);border:1px solid rgba(20,40,75,.15);border-radius:999px;padding:6px 11px}
.menu a i,.list a i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.menu a:hover,.menu a:focus-visible,.list a:hover,.list a:focus-visible{background:#fff;outline:2px solid var(--c);outline-offset:2px}
.bar{position:absolute;left:0;right:0;bottom:2%;display:flex;gap:10px;justify-content:center}
.bar button{font:600 clamp(10px,1vw,12px) var(--mono);color:var(--navy);background:rgba(255,255,255,.82);border:1px solid rgba(20,40,75,.2);border-radius:6px;padding:7px 12px;cursor:pointer}
.bar button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#skip{display:none}.playing #skip{display:block}
#replay{display:none}.ended #replay{display:block}
.list{display:none}
.screen{position:fixed;inset:0;background:var(--ice);z-index:20;display:flex;flex-direction:column;gap:14px;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto;transform-origin:0 0;transition:transform .7s cubic-bezier(.16,.8,.2,1),opacity .4s}
.screen[hidden]{display:none!important}
.screen h2{font-family:var(--disp);font-size:clamp(28px,5vw,52px);margin:0}
.screen code{font-weight:600;font-size:clamp(14px,2vw,20px)}
.screen p{max-width:60ch;color:var(--ink-soft);line-height:1.6;margin:0}
.screen button{align-self:flex-start;font:600 13px var(--mono);padding:9px 14px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
@media (max-width:700px){
  body{justify-content:flex-start}
  .player{width:100vw}
  .hot,.menu{display:none}
  .ended .list{display:flex}
  .list{flex-direction:column;gap:10px;align-items:stretch;width:100%;padding:16px max(16px,env(safe-area-inset-left,0px)) 28px;max-width:480px}
  .list a{border-radius:8px;font-size:13px;padding:11px 12px;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.screen,.menu,.hot{transition:none}}
</style>
</head>
<body>
<main class="player playing" id="player">
  <video id="v" muted playsinline preload="auto" poster="/inicio.jpg" aria-label="Abertura da NØUS">
    <source src="/nous-abertura.mp4" type="video/mp4">
  </video>
  <nav class="menu" id="menu" aria-label="Menu principal"></nav>
  <div id="hots"></div>
  <div class="bar">
    <button id="skip" type="button">Pular introdução</button>
    <button id="sound" type="button">Ligar som</button>
    <button id="replay" type="button">Repetir</button>
  </div>
</main>
<nav class="list" id="list" aria-label="Links"></nav>

<section class="screen" id="screen" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <code id="sCode"></code>
  <h2 id="sTitle"></h2>
  <p>Aqui entra a tela desta área. O link cresceu até ocupar a página. Conteúdo real a definir.</p>
  <button id="back" type="button">Voltar para a abertura</button>
</section>

<script>
/* ===== EDITE AQUI =====
   LINKS: cada item é um link. "kind" define cor e rótulo (sintaxe do print).
   box:[x,y,largura,altura] em pixels do vídeo (1280x720): onde o link fica sobre a imagem.
   Sem "box": aparece só no menu. As seis linhas da abertura já estão no vídeo;
   para mudá-las é preciso renderizar o vídeo de novo. */
var KINDS={
  sql:{label:"SQL",color:"#7c3aed"},js:{label:"JavaScript",color:"#d6336c"},
  python:{label:"Python",color:"#15803d"},terminal:{label:"Terminal",color:"#b45309"},
  http:{label:"API",color:"#1d6fd8"},block:{label:"Python",color:"#475569"},
  produto:{label:"Produto",color:"#ff6a1a"}
};
var LINKS=[
  {area:"Dados",kind:"sql",text:"SELECT * FROM nossa_atuacao;",route:"/dados",box:[137,70,189,54]},
  {area:"Desenvolvimento",kind:"js",text:'const proposta = "Nossa atuação";',route:"/desenvolvimento",box:[1018,94,245,57]},
  {area:"Inteligência artificial",kind:"python",text:'modelo.predict("Nossa atuação")',route:"/ia",box:[45,556,280,62]},
  {area:"Infraestrutura",kind:"terminal",text:"$ nous deploy --cloud",route:"/infraestrutura",box:[715,595,198,62]},
  {area:"Integrações",kind:"http",text:"GET /nossas-solucoes",route:"/integracoes",box:[28,631,241,70]},
  {area:"NØUS",kind:"block",text:"NØUS(\n    conecte,\n    entenda,\n    evolua\n)",route:"/nous",box:[1109,549,146,150]},
  {area:"PØP9",kind:"produto",text:"PØP9",route:"/pop9",box:[98,228,242,93]},
  {area:"KØMM",kind:"produto",text:"KØMM",route:"/komm",box:[98,332,242,158]},
  {area:"KømVøS",kind:"produto",text:"KømVøS",route:"/komvos",box:[921,211,300,302]},
  {area:"Home",kind:"terminal",text:"$ cd ~/nous",route:"/"},
  {area:"Documentação",kind:"terminal",text:"$ nous docs --open",route:"/documentacao"},
  {area:"APIs",kind:"http",text:"GET /api/v1/docs",route:"/api"}
];
/* ===== FIM ===== */
(function(){
  var W=1280,H=720;
  var player=document.getElementById("player"),v=document.getElementById("v"),hots=document.getElementById("hots");
  var menu=document.getElementById("menu"),list=document.getElementById("list");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  LINKS.forEach(function(l){
    var k=KINDS[l.kind]||KINDS.block;
    var label=function(a){a.href="#"+l.route;a.dataset.area=l.area;a.dataset.t=l.text;a.style.setProperty("--c",k.color);a.innerHTML="<i></i>"+l.area;return a};
    menu.appendChild(label(document.createElement("a")));
    list.appendChild(label(document.createElement("a")));
    if(l.box){
      var h=document.createElement("a");h.className="hot";h.href="#"+l.route;h.dataset.area=l.area;h.dataset.t=l.text;
      h.setAttribute("aria-label",l.area+": "+l.text.replace(/\s+/g," "));h.style.setProperty("--c",k.color);
      h.style.left=(l.box[0]/W*100)+"%";h.style.top=(l.box[1]/H*100)+"%";h.style.width=(l.box[2]/W*100)+"%";h.style.height=(l.box[3]/H*100)+"%";
      hots.appendChild(h);
    }
  });
  function end(){player.classList.remove("playing");player.classList.add("ended");document.body.className="ended"}
  function start(){player.classList.add("playing");player.classList.remove("ended");document.body.className="";v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){})}
  v.addEventListener("ended",end);
  document.getElementById("skip").addEventListener("click",function(){v.pause();if(v.duration)v.currentTime=Math.max(0,v.duration-0.05);end()});
  document.getElementById("replay").addEventListener("click",start);
  var snd=document.getElementById("sound");
  snd.addEventListener("click",function(){v.muted=!v.muted;snd.textContent=v.muted?"Ligar som":"Desligar som"});
  if(reduce){
    v.removeAttribute("autoplay");v.poster="/final.jpg";v.preload="metadata";
    v.addEventListener("loadedmetadata",function(){v.currentTime=Math.max(0,v.duration-0.05);end()});
    end();
  }else{
    var p=v.play();if(p&&p.catch)p.catch(function(){/* autoplay bloqueado: o botão Repetir/Pular continua funcionando */});
  }
  /* tela que cresce */
  var screenEl=document.getElementById("screen"),last=null;
  function open(a){
    last=a;var r=a.getBoundingClientRect();
    document.getElementById("sCode").textContent=a.dataset.t.replace(/\s*\n\s*/g," ");
    document.getElementById("sTitle").textContent=a.dataset.area;
    screenEl.hidden=false;
    if(!reduce&&r.width){screenEl.style.transition="none";screenEl.style.opacity="0.2";
      screenEl.style.transform="translate("+r.left+"px,"+r.top+"px) scale("+(r.width/innerWidth)+","+(r.height/innerHeight)+")";
      screenEl.getBoundingClientRect();screenEl.style.transition="";screenEl.style.opacity="1";screenEl.style.transform="none"}
    document.getElementById("back").focus();
  }
  function close(){screenEl.hidden=true;screenEl.style.transform="";if(location.hash)history.replaceState(null,"","#");if(last)last.focus()}
  document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest(".hot,.menu a,.list a");if(!a)return;e.preventDefault();open(a)});
  document.getElementById("back").addEventListener("click",close);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!screenEl.hidden)close()});
})();
</script>
</body>
</html>
