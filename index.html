<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NØÜS — Conecte. Entenda. Evolua.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700&display=swap">
<style>
:root{--ice:#eef2f7;--navy:#14284b;--orange:#ff6a1a;--ink-soft:#5b6b82;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--disp:"Sora",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ice);color:var(--navy);font-family:var(--mono);overflow-x:hidden}
.player{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--ice)}
.player video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
/* cartões de link (reais, <a>) e etiquetas de IDE/linguagem (decorativas) */
.lk{position:absolute;left:0;top:0;display:block;width:max-content;max-width:46vw;text-decoration:none;color:var(--c);
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.85);outline:1px solid rgba(20,40,75,.1);outline-offset:-3px;
  border-radius:10px;padding:9px 14px 10px;box-shadow:0 10px 24px rgba(20,40,75,.1);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  font:600 15px/1.45 var(--mono);white-space:pre;opacity:0;pointer-events:none;will-change:transform,opacity}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:6px;flex:none}.lk .ic{width:17px;height:17px;vertical-align:-4px;margin-right:7px;color:var(--c)}.lk .a{display:block;font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.ended .lk{pointer-events:auto}
.lk:hover,.lk:focus-visible{outline:2px solid var(--c);outline-offset:1px;background:rgba(255,255,255,.92)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:999px;font:600 13px/1 var(--mono);color:var(--navy);pointer-events:none!important}
.chip b{display:inline-block;min-width:24px;padding:4px 5px;border-radius:7px;background:var(--c);color:#fff;font:700 10px/1 var(--mono);text-align:center}
.menu{display:none!important;position:absolute;top:2.2%;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px;opacity:0;pointer-events:none;transition:opacity .8s .6s}
.ended .menu{opacity:1;pointer-events:auto}
.menu a,.list a{display:inline-flex;gap:7px;align-items:center;font:600 clamp(10px,1.05vw,13px) var(--mono);color:var(--navy);text-decoration:none;background:rgba(255,255,255,.78);border:1px solid rgba(20,40,75,.15);border-radius:999px;padding:6px 11px}
.menu a i,.list a i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.menu a:hover,.menu a:focus-visible,.list a:hover,.list a:focus-visible{background:#fff;outline:2px solid var(--c);outline-offset:2px}
.menu .sep{width:1px;background:rgba(20,40,75,.2);margin:2px 4px}
.bar{position:absolute;left:0;right:0;bottom:2%;display:flex;gap:10px;justify-content:center;pointer-events:none}
.bar button{pointer-events:auto;font:600 clamp(10px,1vw,12px) var(--mono);color:var(--navy);background:rgba(255,255,255,.82);border:1px solid rgba(20,40,75,.2);border-radius:6px;padding:7px 12px;cursor:pointer}
.bar button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#skip{display:none}.playing #skip{display:block}
#replay{display:none}.ended #replay{display:block}
.list{display:none}
.screen{position:fixed;inset:0;background:var(--ice);z-index:20;display:flex;flex-direction:column;gap:14px;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto;transform-origin:0 0;transition:transform .7s cubic-bezier(.16,.8,.2,1),opacity .4s}
.screen[hidden]{display:none!important}
.screen h2{font-family:var(--disp);font-size:clamp(28px,5vw,52px);margin:0}
.screen code{font-weight:600;font-size:clamp(14px,2vw,20px)}
.screen img{max-width:min(420px,80vw);height:auto;align-self:flex-start}
.screen p{max-width:60ch;color:var(--ink-soft);line-height:1.6;margin:0}
.screen button{align-self:flex-start;font:600 13px var(--mono);padding:9px 14px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
@media (max-width:700px){
  .player{height:auto;aspect-ratio:16/9;overflow:visible}
  .player video{object-fit:contain}
  .lk,.menu{display:none}
  .ended .list{display:flex}
  .list{flex-direction:column;gap:10px;align-items:stretch;width:100%;padding:16px max(16px,env(safe-area-inset-left,0px)) 28px;max-width:480px;margin:0 auto}
  .list a{border-radius:8px;font-size:13px;padding:11px 12px;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.screen,.menu{transition:none}}
</style>
</head>
<body>
<main class="player playing" id="player">
  <video id="v" muted playsinline preload="auto" poster="/inicio.jpg" aria-label="Abertura da NØUS">
    <source src="/nous-abertura-v2.mp4" type="video/mp4">
  </video>
  <nav class="menu" id="menu" aria-label="Menu principal"></nav>
  <div id="cards"></div>
  <div class="bar">
    <button id="skip" type="button">Pular introdução</button>
    <button id="sound" type="button">Ligar som</button>
    <button id="replay" type="button">Repetir</button>
  </div>
</main>
<nav class="list" id="list" aria-label="Links"></nav>

<section class="screen" id="screen" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <code id="sCode"></code>
  <h2 id="sTitle"></h2>
  <img id="sLogo" alt="" hidden>
  <p>Aqui entra a tela desta área. O link cresceu até ocupar a página. Conteúdo real a definir.</p>
  <button id="back" type="button">Voltar para a abertura</button>
</section>

<script>
/* ===== EDITE AQUI =====
   O vídeo (cena em scene/cena.html) já traz logo, slogan, racks, diagrama e growth.
   Os links abaixo são vivos e entram por cima do último quadro, em duas escadas no chão.
   - kind: cor e rótulo (sintaxe do print).
   - slot: [x, y, escala, giro] no quadro do vídeo (1280x720). Sem slot, o link aparece só no menu.
   - group "produto": fica depois do separador no menu.
   Para mais links: copie uma linha, mude texto e rota. */
var KINDS={
  sql:{label:"SQL",color:"#7c3aed"},js:{label:"JavaScript",color:"#d6336c"},
  python:{label:"Python",color:"#15803d"},terminal:{label:"Terminal",color:"#b45309"},
  http:{label:"API",color:"#1d6fd8"},block:{label:"Python",color:"#475569"},
  produto:{label:"Produto",color:"#ff6a1a"}
};
var ICONS={
 "Dados":'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
 "Desenvolvimento":'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 5l-4 14"/>',
 "Inteligência artificial":'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
 "Infraestrutura":'<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9.5z"/>',
 "Integrações":'<circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6"/>',
 "APIs":'<path d="M8 4c-3 0-3 2-3 4s0 3-2 4c2 1 2 2 2 4s0 4 3 4M16 4c3 0 3 2 3 4s0 3 2 4c-2 1-2 2-2 4s0 4-3 4"/>',
 "Documentação":'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
 "Produtos":'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
 "NØUS":'<path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M9 9l6 6"/>',
 "Home":'<path d="M4 11l8-7 8 7v9H4z"/>',
 "PØP9":'<rect x="4" y="4" width="16" height="16" rx="3"/>',"KØMM":'<rect x="4" y="4" width="16" height="16" rx="3"/>',"KømVøS":'<rect x="4" y="4" width="16" height="16" rx="3"/>'
};
function icon(a){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[a]||ICONS.Produtos)+'</svg>'}
var LINKS=[
  {area:"Dados",kind:"sql",text:"SELECT * FROM nossa_atuacao;",route:"/dados",slot:[150,665,1.0,50]},
  {area:"Desenvolvimento",kind:"js",text:'const proposta = "Nossa atuação";',route:"/desenvolvimento",slot:[1130,665,1.0,-50]},
  {area:"Inteligência artificial",kind:"python",text:'modelo.predict("Nossa atuação")',route:"/ia",slot:[262,612,.88,46]},
  {area:"Infraestrutura",kind:"terminal",text:"$ nous deploy --cloud",route:"/infraestrutura",slot:[1020,612,.88,-46]},
  {area:"Integrações",kind:"http",text:"GET /nossas-solucoes",route:"/integracoes",slot:[372,560,.76,42]},
  {area:"NØUS",kind:"block",text:"NØUS(\n    conecte,\n    entenda,\n    evolua\n)",route:"/nous",slot:[925,548,.76,-42]},
  {area:"Documentação",kind:"terminal",text:"$ nous docs --open",route:"/documentacao",slot:[470,512,.66,38]},
  {area:"APIs",kind:"http",text:"GET /api/v1/docs",route:"/api",slot:[825,512,.66,-38]},
  {area:"Produtos",kind:"produto",text:"PØP9  ·  KØMM  ·  KømVøS",route:"/produtos",slot:[640,640,.8,0],w:236},
  {area:"Home",kind:"terminal",text:"$ cd ~/nous",route:"/"},
  {area:"PØP9",kind:"produto",text:"PØP9",route:"/pop9",group:"produto"},
  {area:"KØMM",kind:"produto",text:"KØMM",route:"/komm",group:"produto"},
  {area:"KømVøS",kind:"produto",text:"KømVøS",route:"/komvos",group:"produto",logo:"/komvos.png"}
];
/* DECOR: IDEs e linguagens (não são links). b = sigla do selo, name = nome. */
var DECOR=[];
/* ===== FIM ===== */
(function(){
  var W=1280,H=720,VP=[640,330];
  var player=document.getElementById("player"),v=document.getElementById("v"),cards=document.getElementById("cards");
  var menu=document.getElementById("menu"),list=document.getElementById("list");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var els=[],sepDone=false;
  LINKS.forEach(function(l){
    var k=KINDS[l.kind]||KINDS.block;
    var lab=function(a){a.href="#"+l.route;a.dataset.area=l.area;a.dataset.t=l.text;if(l.logo)a.dataset.logo=l.logo;a.style.setProperty("--c",k.color);a.innerHTML=icon(l.area)+l.area;return a};
    if(l.group==="produto"&&!sepDone){sepDone=true;var s=document.createElement("span");s.className="sep";menu.appendChild(s)}
    menu.appendChild(lab(document.createElement("a")));
    list.appendChild(lab(document.createElement("a")));
    if(l.slot){
      var c=document.createElement("a");c.className="lk";c.href="#"+l.route;c.dataset.area=l.area;c.dataset.t=l.text;
      c.style.setProperty("--c",k.color);c.innerHTML='<span class="a">'+icon(l.area)+l.area+" · "+k.label+"</span>";
      var tx=document.createElement("span");tx.textContent=l.text;c.appendChild(tx);
      c.setAttribute("aria-label",l.area+": "+l.text.replace(/\s+/g," "));
      if(l.w)c.style.minWidth=l.w+"px";cards.appendChild(c);els.push({el:c,s:l.slot});
    }
  });
  DECOR.forEach(function(d){
    var c=document.createElement("div");c.className="lk chip";c.setAttribute("aria-hidden","true");c.style.setProperty("--c",d.c);
    c.innerHTML="<b>"+d.b+"</b>"+d.name;cards.appendChild(c);els.push({el:c,s:d.slot});
  });
  var t0=null,raf=0;
  var ease=function(x){x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3)};
  function geom(){var pw=player.clientWidth,ph=player.clientHeight,sc=Math.max(pw/W,ph/H);return {sc:sc,ox:(pw-W*sc)/2,oy:(ph-H*sc)/2,pw:pw,ph:ph}}
  function draw(now){
    var g=geom(),ytop=g.oy+390*g.sc,ybot=g.oy+665*g.sc,lim=g.ph-70,
        k=ybot>lim?Math.max(.45,(lim-ytop)/(ybot-ytop)):1;
    els.forEach(function(o){
      var q=reduce?1:ease((now-o.delay)/1100),
          fx=Math.min(Math.max(g.ox+o.s[0]*g.sc,80),g.pw-80),
          fy=Math.max(ytop+(g.oy+o.s[1]*g.sc-ytop)*k,g.oy+120*g.sc),
          vx=g.ox+VP[0]*g.sc,vy=g.oy+VP[1]*g.sc,
          x=vx+(fx-vx)*q,y=vy+(fy-vy)*q,
          sc=(.1+.9*q)*o.s[2]*Math.min(1,g.sc*1.05+.1)*(.6+.4*k),
          ry=o.s[3]*(1.6-.6*q);
      o.el.style.opacity=Math.min(1,q*2.2);
      o.el.style.transform="translate("+x+"px,"+y+"px) translate(-50%,-50%) perspective(650px) rotateY("+ry+"deg) rotateZ("+(-o.s[3]/14)+"deg) scale("+sc+")";
    });
  }
  function loop(ts){if(t0===null)t0=ts;draw(ts-t0);if(ts-t0<1100+els.length*110+100)raf=requestAnimationFrame(loop)}
  function showCards(){els.forEach(function(o,i){o.delay=i*110});if(reduce){draw(1e6);return}t0=null;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  function hideCards(){cancelAnimationFrame(raf);els.forEach(function(o){o.el.style.opacity=0})}
  addEventListener("resize",function(){if(player.classList.contains("ended"))draw(1e6)});

  function end(){player.classList.remove("playing");player.classList.add("ended");document.body.className="ended";showCards()}
  function start(){hideCards();player.classList.add("playing");player.classList.remove("ended");document.body.className="";v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){})}
  v.addEventListener("ended",end);
  document.getElementById("skip").addEventListener("click",function(){v.pause();if(v.duration)v.currentTime=Math.max(0,v.duration-0.05);end()});
  document.getElementById("replay").addEventListener("click",start);
  var snd=document.getElementById("sound");
  snd.addEventListener("click",function(){v.muted=!v.muted;snd.textContent=v.muted?"Ligar som":"Desligar som"});
  if(reduce){
    v.poster="/final.jpg";v.preload="metadata";
    v.addEventListener("loadedmetadata",function(){v.currentTime=Math.max(0,v.duration-0.05)});
    end();
  }else{
    var p=v.play();if(p&&p.catch)p.catch(function(){/* autoplay bloqueado: Pular/Repetir continuam funcionando */});
  }
  /* tela que cresce */
  var screenEl=document.getElementById("screen"),last=null,logo=document.getElementById("sLogo");
  function open(a){
    last=a;var r=a.getBoundingClientRect();
    document.getElementById("sCode").textContent=a.dataset.t.replace(/\s*\n\s*/g," ");
    document.getElementById("sTitle").textContent=a.dataset.area;
    if(a.dataset.logo){logo.src=a.dataset.logo;logo.alt=a.dataset.area;logo.hidden=false}else{logo.hidden=true}
    screenEl.hidden=false;
    if(!reduce&&r.width){screenEl.style.transition="none";screenEl.style.opacity="0.2";
      screenEl.style.transform="translate("+r.left+"px,"+r.top+"px) scale("+(r.width/innerWidth)+","+(r.height/innerHeight)+")";
      screenEl.getBoundingClientRect();screenEl.style.transition="";screenEl.style.opacity="1";screenEl.style.transform="none"}
    document.getElementById("back").focus();
  }
  function close(){screenEl.hidden=true;screenEl.style.transform="";if(location.hash)history.replaceState(null,"","#");if(last)last.focus()}
  document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest(".lk:not(.chip),.menu a,.list a");if(!a)return;e.preventDefault();open(a)});
  document.getElementById("back").addEventListener("click",close);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!screenEl.hidden)close()});
})();
</script>
</body>
</html>
